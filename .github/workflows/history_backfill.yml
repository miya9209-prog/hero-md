name: 최근 3년 HERO 학습데이터 수집

on:
  workflow_dispatch:

jobs:
  backfill-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
      CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
      CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
    steps:
      - name: 레포 코드 불러오기
        uses: actions/checkout@v4
      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt
      - name: DB 구조 확인
        run: python -m scripts.init_db
      - name: 최근 36개월 학습데이터 수집
        run: python -m scripts.sync_history --months 36
