name: 30분 HERO 데이터 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

jobs:
  sync-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
      CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
      CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}

    steps:
      - name: 레포 코드 불러오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: DB 구조 확인
        run: python -m scripts.init_db

      - name: HERO 관찰상품 Analytics 갱신
        run: python -m scripts.sync_cafe24 --launches
