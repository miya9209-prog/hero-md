name: 상품탐색 v4 이전 오탐 정리

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}

    steps:
      - name: 레포 코드 불러오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: DB 구조 확인
        run: python -m scripts.init_db

      - name: v4 이전 현재 관찰중 자동탐색만 관찰종료
        run: python -m scripts.cleanup_discovery_v3
